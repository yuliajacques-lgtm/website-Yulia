.booking-intro{padding:50px 45px;background:var(--soft);display:flex;flex-direction:column;align-items:flex-start}
.booking-intro h3{font-size:clamp(33px,3.35vw,46px);line-height:1.15;margin:21px 0 17px}
.booking-intro p{font-size:14px;line-height:1.82;max-width:365px}
.booking-details{width:100%;border-top:1px solid var(--line);padding-top:21px;margin-top:26px;margin-bottom:23px;display:grid;gap:14px}
.booking-detail{display:flex;align-items:center;gap:11px;color:var(--ink);font-size:12px}
.booking-icon{display:inline-flex;width:28px;height:28px;border:1px solid var(--line);align-items:center;justify-content:center;font-size:15px}
.booking-action{margin-top:5px}
.booking-action[hidden]{display:none}
.booking-frame{min-width:0;min-height:485px;background:var(--paper);display:flex;align-items:stretch;justify-content:stretch}
.booking-frame iframe{width:100%;height:690px;border:0;display:block;background:#fff}
.booking-setup{width:100%;padding:60px 55px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.booking-setup-icon{width:64px;height:64px;border:1px solid #BACAD9;display:grid;place-items:center;color:var(--accent);font-size:29px;font-family:var(--serif);margin-bottom:2px}
.booking-setup h4{font:normal 27px/1.2 var(--serif);margin:0}
.booking-setup p{max-width:350px;font-size:13px;line-height:1.75;margin:0}
.booking-setup small{max-width:365px;color:var(--ink2);font-size:11px;line-height:1.6}
.booking-widget{width:100%;min-width:320px;min-height:690px}
@media(max-width:900px){.booking-intro{padding:36px 29px}.booking-frame{min-height:400px}.booking-setup{padding:40px 30px}}
@media(max-width:650px){.booking-card{grid-template-columns:minmax(0,1fr)}.booking-intro{padding:32px 26px}.booking-intro h3{font-size:34px}.booking-frame{min-height:310px}.booking-frame iframe{height:690px}.booking-setup{min-height:310px;padding:34px 26px}}

/* Fees & formats: two clear offers, responsive and consistent with the editorial design. */
.pricing-section{background:var(--soft)}
.pricing-header{display:grid;grid-template-columns:1.05fr .95fr;gap:8%;align-items:end;margin-bottom:44px}
.pricing-header p{max-width:440px;margin:0 0 8px;line-height:1.85}
.pricing-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pricing-card{border:1px solid var(--line);background:var(--paper);padding:38px 39px 36px;display:flex;flex-direction:column;min-height:465px}
.pricing-card--programme{background:var(--bg);border-color:#AEBFCC}
.pricing-card-top{display:flex;align-items:start;justify-content:space-between;gap:15px;margin-bottom:28px}
.pricing-number{font-size:10px;font-weight:750;letter-spacing:.15em;text-transform:uppercase;color:var(--ink2)}
.pricing-price{font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);border:1px solid #B8C7D2;padding:8px 11px;text-align:center;max-width:225px}
.pricing-price--filled{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pricing-card h3{font-size:33px;margin:0 0 12px}
.pricing-duration{display:flex;gap:10px;align-items:baseline;margin:8px 0 18px}
.pricing-duration strong{font:normal 38px/1.1 var(--serif);letter-spacing:-.055em;color:var(--ink)}
.pricing-duration span{font-size:12px;color:var(--ink2)}
.pricing-description{font-size:14px;line-height:1.84;max-width:460px;margin:0 0 27px}
.pricing-inclusions{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:10px}
.pricing-inclusions li{padding-left:20px;position:relative;color:var(--ink2);font-size:13px;line-height:1.65}
.pricing-inclusions li:before{content:'↗';position:absolute;left:0;color:var(--accent);font-weight:700}
.pricing-card-bottom{margin-top:auto;padding-top:20px;border-top:1px solid var(--line)}
.pricing-card-bottom .btn{max-width:100%;text-align:center}
.pricing-footer{font-size:12px;margin:21px 0 0;line-height:1.7;max-width:720px;color:var(--ink2)}
@media(max-width:900px){.pricing-header{grid-template-columns:1fr;gap:10px}.pricing-card{padding:28px 26px;min-height:435px}}
@media(max-width:650px){.pricing-grid{grid-template-columns:1fr}.pricing-card{min-height:0;padding:30px 26px}.pricing-card h3{font-size:29px}.pricing-duration strong{font-size:34px}.pricing-card-top{gap:8px}.pricing-price{font-size:10px}}

<div class="section-head" style="margin-top:90px"><div><div class="eyebrow">${t.stepsK}</div><h2 style="margin-top:18px">${t.stepsTitle}</h2></div></div><div class="process">${t.steps.map(s=>`<div class="step"><div class="step-num">${s[0]}</div><h4>${s[1]}</h4><p>${s[2]}</p></div>`).join('')}</div><div class="actions" style="margin-top:30px"><a class="btn" href="#booking">${t.offersCta} &nbsp;↗</a><a class="btn btn-secondary" href="#pricing">${t.pricingNavCta} &nbsp;↗</a></div><div class="notice">${t.offersNote}</div></div></section>

<section id="pricing" class="section pricing-section"><div class="wrap">
  <div class="eyebrow">${t.pricingK}</div>
  <div class="pricing-header"><h2 style="margin:17px 0 0">${t.pricingTitle}</h2><p>${t.pricingLead}</p></div>
  <div class="pricing-grid">
    <article class="pricing-card pricing-card--discovery"><div class="pricing-card-top"><span class="pricing-number">${t.pricingFirstK}</span><span class="pricing-price pricing-price--filled">${t.pricingFree}</span></div>
      <h3>${t.pricingFirstTitle}</h3><div class="pricing-duration"><strong>${t.pricingFirstMetric}</strong><span>${t.pricingFirstMeta}</span></div>
      <p class="pricing-description">${t.pricingFirstBody}</p>
      <div class="pricing-card-bottom"><a class="btn" href="#booking">${t.pricingFirstCta} &nbsp;↗</a></div>
    </article>
    <article class="pricing-card pricing-card--programme"><div class="pricing-card-top"><span class="pricing-number">${t.pricingSecondK}</span><span class="pricing-price">${displayPrice}</span></div>
      <h3>${t.pricingSecondTitle}</h3><div class="pricing-duration"><strong>${t.pricingSecondMetric}</strong><span>${t.pricingSecondMeta}</span></div>
      <p class="pricing-description">${t.pricingSecondBody}</p><ul class="pricing-inclusions">${t.pricingInclusions.map(v=>`<li>${v}</li>`).join('')}</ul>
      <div class="pricing-card-bottom"><a class="btn btn-secondary" href="#booking">${t.pricingSecondCta} &nbsp;↗</a></div>
    </article>
  </div>
  <p class="pricing-footer">${t.pricingFooter}</p>
</div></section>
<section id="contact" class="section contact-section"><div class="wrap">
  <div class="contact-header"><div><div class="eyebrow">${t.contactK}</div><h2 style="margin-top:17px">${t.contactTitle}</h2></div><p class="lead">${t.contactLead}</p></div>
  <div class="booking-card" id="booking">
    <div class="booking-intro"><div class="eyebrow">${t.bookingK}</div><h3>${t.bookingTitle}</h3><p>${t.bookingBody}</p>
    <div class="booking-details"><div class="booking-detail"><span class="booking-icon">◷</span>${t.bookingDuration}</div><div class="booking-detail"><span class="booking-icon">◎</span>${t.bookingLang}</div></div>
    <a id="bookingLink" class="btn booking-action" hidden target="_blank" rel="noopener noreferrer">${t.bookingCta} &nbsp;↗</a></div>
    <div id="bookingFrame" class="booking-frame" aria-label="${e(t.bookingPreviewTitle)}"></div>
  </div>
  <div class="contact-columns"><aside class="contact-aside"><div class="eyebrow">${t.contactAsideK}</div><h3>${t.contactAsideTitle}</h3><p>${t.contactAsideBody}</p><div class="contact-divider"></div>
  <p class="contact-process">${t.contactProcess}</p>
  <div class="contact-languages"><span class="eyebrow">${t.contactLangTitle}</span><strong>Français · English · Русский</strong></div></aside>
  <div class="contact-panel"><div class="eyebrow">${t.contactFormK}</div><h3>${t.contactFormTitle}</h3><p>${t.contactFormIntro}</p>
  <form id="contactForm" class="contact-form"><div class="contact-form-row"><label>${t.contactName}<input type="text" name="name" autocomplete="name" required maxlength="120"></label><label>${t.contactEmail}<input type="email" name="email" autocomplete="email" required maxlength="180"></label></div>
  <label>${t.contactTopic}<select name="topic" required><option value="" disabled selected>${t.contactTopicDefault}</option>${t.contactTopics.map(o=>`<option value="${e(o)}">${e(o)}</option>`).join('')}</select></label>
  <label>${t.contactMessage}<textarea name="message" rows="5" required maxlength="4000" placeholder="${e(t.contactMessagePh)}"></textarea></label>
  <div class="contact-form-bottom"><button class="btn" type="submit">${t.contactSend}</button><span>${t.contactRequired}</span></div>
  <p class="form-status" id="contactStatus" role="status" aria-live="polite">${t.contactFormStatus}</p>
  <p class="contact-privacy">${t.contactPrivacy}</p><textarea id="contactFallback" class="contact-fallback" readonly aria-label="Message to copy" hidden></textarea>
  </form></div></div>
 </div></section>`;
$('#footerSub').textContent=t.footer;$('#footNote').textContent=t.footNote;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===language));
setupContactForm();setupBooking();highlightNav();}
// Insert ONLY the public booking page for a 30-minute appointment (never a private calendar or ICS feed).
// Google Calendar example: https://calendar.google.com/calendar/appointments/schedules/...
// Calendly example: https://calendly.com/your-profile/30min
const BOOKING_URL = '';
function setupBooking(){
  const frame=$('#bookingFrame'), link=$('#bookingLink');
  if(!frame||!link)return;
  const t=TEXT[language];
  let url;
  try{url=new URL(BOOKING_URL.trim());if(url.protocol!=='https:')throw Error('https required')}
  catch{url=null}
  if(!url){
    link.hidden=true;
    frame.innerHTML=`<div class="booking-setup"><div class="booking-setup-icon" aria-hidden="true">◷</div><h4>${t.bookingPreviewTitle}</h4><p>${t.bookingPreviewText}</p><small>${t.bookingSetup}</small></div>`;
    return;
  }
  link.hidden=false;link.href=url.href;link.textContent=t.bookingOpen+' ↗';
  const host=url.hostname.toLowerCase();
  if(host==='calendar.google.com'&&url.pathname.startsWith('/calendar/appointments/schedules/')){
    const iframe=document.createElement('iframe');
    iframe.src=url.href;iframe.title=t.bookingPreviewTitle;
    iframe.loading='lazy';iframe.referrerPolicy='strict-origin-when-cross-origin';
    iframe.setAttribute('allow','payment');frame.replaceChildren(iframe);
  } else if(host==='calendly.com'||host.endsWith('.calendly.com')){
    frame.innerHTML='<div class="booking-widget" id="calendly-booking-widget"></div>';
    function initCalendly(){if(!window.Calendly)return;const parent=$('#calendly-booking-widget');if(parent)window.Calendly.initInlineWidget({url:url.href,parentElement:parent});}
    if(window.Calendly){initCalendly()}
    else{
      let script=document.getElementById('calendly-widget-script');
      if(!script){script=document.createElement('script');script.id='calendly-widget-script';script.src='https://assets.calendly.com/assets/external/widget.js';script.onload=initCalendly;document.head.appendChild(script)}
      else{script.addEventListener('load',initCalendly,{once:true})}
    }
  } else{
    frame.innerHTML=`<div class="booking-setup"><div class="booking-setup-icon" aria-hidden="true">↗</div><h4>${t.bookingPreviewTitle}</h4><p>${t.bookingPreviewText}</p><a class="btn btn-secondary" href="${e(url.href)}" target="_blank" rel="noopener noreferrer">${t.bookingOpen} ↗</a></div>`;
  }
}
const CONTACT_EMAIL = ''; // Configure your professional email before publishing (or connect a secure form backend).
function setupContactForm(){
  const form=$('#contactForm'); if(!form)return;
  form.addEventListener('submit',async ev=>{
   ev.preventDefault(); if(!form.reportValidity())return;
   const t=TEXT[language], f=new FormData(form);
   const body=[t.contactName+': '+f.get('name'),t.contactEmail+': '+f.get('email'),t.contactTopic+': '+f.get('topic'),'',''+f.get('message')].join('\n');
   const recipient=CONTACT_EMAIL.trim();
   const status=$('#contactStatus');
   const draft=$('#contactFallback');
   if(recipient){
      const subject=encodeURIComponent(t.contactSubject+' : '+f.get('topic'));
      window.location.href='mailto:'+encodeURIComponent(recipient)+'?subject='+subject+'&body='+encodeURIComponent(body);
      status.textContent=t.contactSuccess;
   } else {
      try {await navigator.clipboard.writeText(body);status.textContent=t.contactConfirm;draft.hidden=true}
      catch {draft.hidden=false;draft.value=body;draft.focus();draft.select();status.textContent=t.contactFallback}
   }
  });
}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{language=b.dataset.lang;render()}));
$('#menu').onclick=()=>$('#nav').classList.toggle('open');document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>$('#nav').classList.remove('open'));
function highlightNav(){let cur=(location.hash||'#home').slice(1);document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===cur))}
window.addEventListener('hashchange',highlightNav);render();
</script>
